<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThermoStats — Stage 2b Label Verification</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --panel:#fff; --rule:#dce3ec; --soft:#eef2f7;
    --ink:#0f1720; --ink2:#33404f; --muted:#5b6673;
    --accent:#2a78d6; --good:#0f8a3d; --bad:#c0392f; --warn:#a4600b;
    --chip:#eaeff5;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0f14; --panel:#131a22; --rule:#26313d; --soft:#1a222c;
    --ink:#eef2f7; --ink2:#c2ccd8; --muted:#8996a5;
    --accent:#6aa6ea; --good:#4cbf6f; --bad:#e8756a; --warn:#d9a04a;
    --chip:#1f2831;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

  header{position:sticky;top:0;z-index:900;background:var(--panel);
    border-bottom:1px solid var(--rule);padding:10px 16px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
  .prog{flex:1;min-width:200px;display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0}
  .counts{display:flex;gap:5px;flex-wrap:wrap}
  .cnt{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.04em;
    text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--chip);color:var(--muted)}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--rule);
    background:var(--panel);color:var(--ink);padding:6px 11px}
  button:hover{background:var(--soft)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);
    gap:14px;padding:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
  .card h2{margin:0;padding:9px 13px;font-size:11px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--rule);font-family:"IBM Plex Mono",monospace}
  .pad{padding:12px 13px}
  #map{height:430px}

  .idline{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
    padding:10px 13px;border-bottom:1px solid var(--rule)}
  .idline .n{font:700 15px/1 "IBM Plex Mono",monospace}
  .idline .coord{font-family:"IBM Plex Mono",monospace;color:var(--ink2)}
  .prov{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.05em;
    text-transform:uppercase;padding:4px 8px;border-radius:4px;
    background:var(--chip);color:var(--warn)}
  .links{margin-left:auto;display:flex;gap:8px}
  .links a{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;
    border:1px solid var(--rule);border-radius:6px;padding:5px 9px}
  .links a:hover{background:var(--soft)}

  table.kv{width:100%;border-collapse:collapse;font-size:12.5px}
  table.kv td{padding:3px 0;vertical-align:top}
  table.kv td:first-child{color:var(--muted);white-space:nowrap;padding-right:12px}
  table.kv td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}

  .osm{max-height:300px;overflow-y:auto}
  .feat{padding:7px 13px;border-bottom:1px solid var(--soft)}
  .feat:last-child{border-bottom:none}
  .feat.key{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .feat .hd{display:flex;gap:8px;align-items:baseline}
  .feat .km{font:600 11px/1 "IBM Plex Mono",monospace;color:var(--muted);flex:none}
  .feat .nm{font-weight:600;font-size:12.5px}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .tag{font:11px/1 "IBM Plex Mono",monospace;padding:3px 6px;border-radius:4px;
    background:var(--chip);color:var(--ink2)}
  .tag b{color:var(--accent)}
  .more{padding:7px 13px;font-size:12px;color:var(--muted);cursor:pointer}
  .more:hover{color:var(--accent)}

  footer{position:sticky;bottom:0;z-index:900;background:var(--panel);
    border-top:1px solid var(--rule);padding:10px 16px;display:flex;
    gap:18px;align-items:center;flex-wrap:wrap}
  .set{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .set > span{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);margin-right:2px}
  .opt{padding:6px 10px;border-radius:6px;border:1px solid var(--rule);
    background:var(--panel);font-size:12.5px;font-weight:600;cursor:pointer}
  .opt kbd{font:10px/1 "IBM Plex Mono",monospace;opacity:.55;margin-left:5px}
  .opt.on[data-v=CORRECT]{background:var(--good);border-color:var(--good);color:#fff}
  .opt.on[data-v=WRONG]{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.on[data-v=UNKNOWN]{background:var(--muted);border-color:var(--muted);color:#fff}
  .opt.on[data-c]{background:var(--accent);border-color:var(--accent);color:#fff}
  #note{flex:1;min-width:150px;padding:6px 9px;border:1px solid var(--rule);
    border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  .hint{font-size:11.5px;color:var(--muted)}
  .empty{padding:20px 13px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>Stage 2b — label verification</h1>
  <div class="prog">
    <div class="bar"><i id="pbar"></i></div>
    <span class="mono" id="ptext" style="font-size:12px">0 / 0</span>
  </div>
  <div class="counts" id="counts"></div>
  <button id="prev">← Prev</button>
  <button id="next">Next →</button>
  <button class="primary" id="export">Export CSV</button>
</header>

<main>
  <div>
    <div class="card">
      <div class="idline">
        <span class="n" id="idx">—</span>
        <span class="coord" id="coord">—</span>
        <span class="prov" id="prov">—</span>
        <span class="links">
          <a id="gmap" target="_blank" rel="noopener">Google Maps</a>
          <a id="gsat" target="_blank" rel="noopener">Google satellite</a>
          <a id="gearth" target="_blank" rel="noopener">Earth</a>
        </span>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <h2>FIRMS thermal history · 2025</h2>
      <div class="pad grid2" id="thermal"></div>
    </div>
    <div class="card">
      <h2>DBSCAN cluster</h2>
      <div class="pad" id="dbscan"></div>
    </div>
    <div class="card">
      <h2>OpenStreetMap features within 1.5 km</h2>
      <div class="osm" id="osm"></div>
    </div>
  </div>
</main>

<footer>
  <div class="set">
    <span>Provisional label</span>
    <button class="opt" data-v="CORRECT">Correct<kbd>1</kbd></button>
    <button class="opt" data-v="WRONG">Wrong<kbd>2</kbd></button>
    <button class="opt" data-v="UNKNOWN">Unknown<kbd>3</kbd></button>
  </div>
  <div class="set" id="classes">
    <span>Verified class</span>
  </div>
  <input id="note" placeholder="note (optional)">
  <span class="hint">↑↓ or j/k to move · auto-saves</span>
</footer>

<script>
const CLASSES = [
  ["factory","f"],["power_plant","p"],["gas_flare","g"],["mining","m"],
  ["refinery","r"],["other_industrial","o"],["unknown","u"]
];
// Tag keys that actually help decide what a site is. Roads and houses are
// present everywhere and tell you nothing, so they sink to the bottom.
const KEY_TAGS = ["man_made","power","industrial","landuse","product","works",
  "resource","mineral","plant:source","plant:method","generator:source",
  "tower:type","pipeline","substance","craft","amenity","operator","building"];
const KEY_VALUES = ["works","flare","petroleum_well","storage_tank","chimney",
  "torch","quarry","mineshaft","refinery","plant","industrial","kiln","furnace"];

let DATA = [], i = 0, results = {};
const LS = "thermostats_verify_v1";

const $ = s => document.querySelector(s);
const load = () => { try { results = JSON.parse(localStorage.getItem(LS)) || {}; }
                     catch (e) { results = {}; } };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(results)); }
                     catch (e) { console.warn("could not persist", e); } };

let map, marker;
function initMap(){
  map = L.map("map", { zoomControl: true });
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Esri, Maxar" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, opacity: 0, attribution: "© OpenStreetMap" });
}

function scoreFeature(f){
  let s = 0;
  for (const [k, v] of Object.entries(f.tags)) {
    if (KEY_TAGS.includes(k)) s += 2;
    if (KEY_VALUES.some(x => String(v).includes(x))) s += 3;
  }
  if (f.name) s += 1;
  return s;
}

function render(){
  const d = DATA[i];
  $("#idx").textContent = `#${i + 1}`;
  $("#coord").textContent = `${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)}  ·  cell ${d.cell_id}  ·  stage-1 ${d.stage1_score}`;
  $("#prov").textContent = `suggested: ${d.provisional_class}`;

  const q = `${d.latitude},${d.longitude}`;
  $("#gmap").href = `https://www.google.com/maps/search/?api=1&query=${q}`;
  $("#gsat").href = `https://www.google.com/maps/@?api=1&map_action=map&center=${q}&zoom=17&basemap=satellite`;
  $("#gearth").href = `https://earth.google.com/web/@${d.latitude},${d.longitude},1000a,0d,0h`;

  map.setView([d.latitude, d.longitude], 16);
  if (marker) marker.remove();
  marker = L.circleMarker([d.latitude, d.longitude],
    { radius: 11, color: "#ff2d2d", weight: 3, fill: false }).addTo(map);

  const t = d.thermal;
  const row = (k, v, u = "") => `<tr><td>${k}</td><td>${v === null || v === undefined ? "—" : v}${u}</td></tr>`;
  $("#thermal").innerHTML =
    `<table class="kv">
      ${row("detections", t.total_detections)}
      ${row("active days", t.active_days)}
      ${row("months active", t.months_active)}
      ${row("duty cycle", t.duty_cycle)}
      ${row("longest gap", t.longest_gap_days, " d")}
      ${row("night fraction", t.night_fraction === null ? null : (t.night_fraction * 100).toFixed(0), "%")}
     </table>
     <table class="kv">
      ${row("FRP mean", t.frp_mean)}
      ${row("FRP max", t.frp_max)}
      ${row("TI4 mean", t.ti4_mean, " K")}
      ${row("TI5 mean", t.ti5_mean, " K")}
      ${row("TI4−TI5", t.ti4_minus_ti5_mean, " K")}
      ${row("spread", t.spread_km, " km")}
     </table>`;

  $("#dbscan").innerHTML = d.dbscan
    ? `<table class="kv">
        ${row("cluster", "#" + d.dbscan.cluster)}
        ${row("member cells", d.dbscan.points)}
        ${row("extent", d.dbscan.extent_km, " km")}
        ${row("OSM verdict", d.dbscan.verdict)}
        ${row("dominant OSM", d.dbscan.dominant_osm || "—")}
       </table>`
    : `<span class="hint">Not in a DBSCAN cluster — an isolated source.</span>`;

  const feats = [...d.osm_features].map(f => ({ ...f, _s: scoreFeature(f) }))
                                   .sort((a, b) => b._s - a._s || a.km - b.km);
  const draw = f => `<div class="feat${f._s >= 3 ? " key" : ""}">
      <div class="hd"><span class="km">${f.km.toFixed(2)} km</span>
      <span class="nm">${f.name ? esc(f.name) : "<span class='hint'>unnamed</span>"}</span></div>
      <div class="tags">${Object.entries(f.tags).slice(0, 10)
        .map(([k, v]) => `<span class="tag">${KEY_TAGS.includes(k) ? `<b>${esc(k)}</b>` : esc(k)}=${esc(String(v))}</span>`)
        .join("")}</div></div>`;
  const top = feats.slice(0, 8), rest = feats.slice(8);
  $("#osm").innerHTML = feats.length
    ? top.map(draw).join("") + (rest.length
        ? `<div class="more" id="more">show ${rest.length} more…</div>
           <div id="restbox" style="display:none">${rest.map(draw).join("")}</div>` : "")
    : `<div class="empty">No tagged OSM features within 1.5 km.</div>`;
  const more = $("#more");
  if (more) more.onclick = () => { $("#restbox").style.display = "block"; more.remove(); };

  const r = results[d.cell_id] || {};
  document.querySelectorAll("[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === r.verdict));
  document.querySelectorAll("[data-c]").forEach(b => b.classList.toggle("on", b.dataset.c === r.verified_class));
  $("#note").value = r.note || "";
  progress();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function progress(){
  const done = Object.values(results).filter(r => r.verdict && r.verified_class).length;
  $("#pbar").style.width = (done / DATA.length * 100) + "%";
  $("#ptext").textContent = `${done} / ${DATA.length}`;
  const tally = {};
  Object.values(results).forEach(r => { if (r.verified_class) tally[r.verified_class] = (tally[r.verified_class] || 0) + 1; });
  $("#counts").innerHTML = CLASSES.filter(([c]) => tally[c])
    .map(([c]) => `<span class="cnt">${c.replace(/_/g, " ")} ${tally[c]}</span>`).join("");
}

function set(field, value){
  const id = DATA[i].cell_id;
  results[id] = Object.assign({
    cell_id: id, latitude: DATA[i].latitude, longitude: DATA[i].longitude,
    provisional_class: DATA[i].provisional_class
  }, results[id], { [field]: value, note: $("#note").value });
  save(); render();
}

function go(step){
  i = Math.max(0, Math.min(DATA.length - 1, i + step));
  render();
}

function exportCsv(){
  const cols = ["cell_id", "latitude", "longitude", "provisional_class",
                "verdict", "verified_class", "note"];
  const rows = DATA.filter(d => results[d.cell_id]).map(d => {
    const r = results[d.cell_id];
    return cols.map(c => {
      const v = r[c] !== undefined ? r[c] : (d[c] !== undefined ? d[c] : "");
      return /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
    }).join(",");
  });
  const blob = new Blob([cols.join(",") + "\n" + rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `stage2b_verified_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Enter") e.target.blur(); return; }
  if (e.key === "1") set("verdict", "CORRECT");
  else if (e.key === "2") set("verdict", "WRONG");
  else if (e.key === "3") set("verdict", "UNKNOWN");
  else if (e.key === "j" || e.key === "ArrowDown") go(1);
  else if (e.key === "k" || e.key === "ArrowUp") go(-1);
  else { const m = CLASSES.find(([, k]) => k === e.key); if (m) set("verified_class", m[0]); }
});

(async function(){
  initMap();
  $("#classes").insertAdjacentHTML("beforeend", CLASSES.map(([c, k]) =>
    `<button class="opt" data-c="${c}">${c.replace(/_/g, " ")}<kbd>${k}</kbd></button>`).join(""));
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => set("verdict", b.dataset.v));
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => set("verified_class", b.dataset.c));
  $("#prev").onclick = () => go(-1);
  $("#next").onclick = () => go(1);
  $("#export").onclick = exportCsv;
  $("#note").onchange = () => set("note", $("#note").value);

  load();
  DATA = await (await fetch("sample.json")).json();
  render();
})();
</script>
</body>
</html>
